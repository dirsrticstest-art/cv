name: Deploy to Vercel
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_xLLj5bMP7LjuOhbNNcDqJYxL
          vercel-project-id: prj_hA6vO3ubvXtiV4VXKmT5NCGGACpN
          vercel-args: '--prod'
